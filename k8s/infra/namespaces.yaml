# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: lovable-core #To save all the core services and statefulsets in one namespace for better organization
  
---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: lovable-previews #This namespace will be used to create and manage all the preview environments for different workspaces, keeping them isolated from the core services and other namespaces

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: lovable-shared-config
  namespace: lovable-core
data:
  PREVIEW_DOMAIN: "previews.codingshuttle.in"
  PREVIEW_NAMESPACE: "lovable-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "http://codingshuttle.in"
